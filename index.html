<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
  <link href="./styles/style.css" rel="stylesheet">
  <script src="./scripts/script.js" defer></script>
  <title>Etch-A-Sketch</title>
</head>
<body>
  <header>
    <h1>Etch-A-Sketch</h1>
  </header>

  <main>
    <form class="settings">
      <fieldset>
        <label class="setting-heading" for="res">Resolution (16-100):</label>
        <input id="res" type="number" min="16" max="100" value="16" placeholder="(16-100)">
        <button id="resize-btn">Apply and reset</button>
        <!-- <p class="res-valid">Resolution: (16-100)</p> -->
      </fieldset>
      <hr>
      <fieldset>
        <legend class="setting-heading">Effetcs</legend>
        <div class="check-setting">
          <input id="rainbow" value="rainbow" type="checkbox">
          <label for="rainbow">Rainbow</label>
        </div>
        <div class="check-setting">
          <input id="progressive" value="progressive" type="checkbox">
          <label for="progressive">Progressive</label>
        </div>
        <hr>
        <button id="clear-btn">Clear grid</button>
      </fieldset>
      
    </form>

    <div class="grid"></div>
  </main>

  <footer>
    <p>&copy 2026 - Mattia Botto</p>
  </footer>
</body>
</html>
